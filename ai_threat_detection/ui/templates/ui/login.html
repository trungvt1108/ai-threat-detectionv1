{% extends "ui/base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="login panel">
  <h1>Đăng nhập</h1>
  <p class="muted small">Console local. Tài khoản tạo bằng <code>python manage.py create_user</code>.</p>
  <form method="post" class="stack">{% csrf_token %}
    {% if form.errors %}<p class="errorlist">Sai tên đăng nhập hoặc mật khẩu.</p>{% endif %}
    <label for="id_username">Tên đăng nhập</label><input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    <label for="id_password">Mật khẩu</label><input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit">Đăng nhập</button></p>
  </form>
</div>
{% endblock %}
